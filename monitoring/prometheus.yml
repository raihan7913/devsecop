# Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'sinfomik-monitor'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'sinfomik-docker'

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Sinfomik Application (health endpoint)
  - job_name: 'sinfomik-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:5000']
    scrape_interval: 15s

  # Frontend is monitored via blackbox HTTP probes for availability (see sinfomik-blackbox-probes)
  # Direct scraping of frontend HTML is disabled because it does not expose Prometheus metrics.


  - job_name: 'sinfomik-blackbox-probes'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://host.docker.internal:3000/
        - http://host.docker.internal:5000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115  # Blackbox exporter service
    scrape_interval: 30s
